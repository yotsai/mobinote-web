<!DOCTYPE html>
<html lang="ja">
<head>

  <title>MobiNote - 車の記録、もっとかんたんに</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #F8FAFC;
      color: #1E293B;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .emoji { font-size: 64px; margin-bottom: 24px; }

    p { font-size: 16px; color: #64748B; line-height: 1.7; max-width: 400px; }
    .links { margin-top: 40px; display: flex; gap: 16px; }

    a:hover { text-decoration: underline; }

  <div class="emoji">🚗</div>

  <div class="links">
